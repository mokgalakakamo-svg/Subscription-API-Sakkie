services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subscription_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-subscription_db}
    ports:
      - "5434:5432"
    volumes:
      - subscription_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subscription_user} -d ${POSTGRES_DB:-subscription_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  subscription-api:
    build:
      context: ./client-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-subscription_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-subscription_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      BILLING_MODE: ${BILLING_MODE:-disabled}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  subscription_data:
