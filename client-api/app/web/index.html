<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7f4" />
  <meta name="description" content="Get tender updates by email." />
  <title>Tender email updates</title>
  <link rel="stylesheet" href="/assets/styles.css?v=4" />
  <script src="/assets/app.js?v=4" defer></script>
</head>
<body>
  <main class="signup-page">
    <section class="signup-card" aria-labelledby="page-title">
      <p class="eyebrow">TENDER EMAIL UPDATES</p>
      <h1 id="page-title">Stay up to date</h1>
      <p class="intro">Subscribe to receive tender updates in your inbox.</p>
      <form id="subscribe-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="320" placeholder="you@example.com" required />
        <button type="submit">Subscribe</button>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
